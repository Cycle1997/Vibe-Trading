# ============================================================================
# 放到你 fork 的： .github/workflows/build-image.yml
#
# 作用：每天定时（也可手动触发）
#   ① 把上游 HKUDS/Vibe-Trading 的 main 合并进你 fork 的 main
#   ② 读 pyproject.toml 的版本号
#   ③ 该版本镜像在 GHCR 上还不存在 → 构建并推送 ghcr.io/<你>/vibe-trading:<版本>
#   ④ 已存在 → 跳过（省时间）
#
# 为什么必须把"同步"和"构建"写在同一个 workflow 里：
#   GitHub 的防递归规则 —— 用内置 GITHUB_TOKEN 推的 commit 不会触发其它 workflow，
#   所以"同步 workflow 触发构建 workflow"这条路是死的，只能同文件里干完。
# ============================================================================
name: Build image from upstream

on:
  schedule:
    - cron: "17 3 * * *" # 每天 03:17 UTC = 北京时间 11:17
  workflow_dispatch:
    inputs:
      tag:
        description: "自定义镜像 tag（留空则用 pyproject.toml 里的版本号）"
        required: false
      force:
        description: "该 tag 已存在也强制重建"
        type: boolean
        default: false

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/HKUDS/Vibe-Trading.git
  BOT_NAME: github-actions[bot]
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 合并并推送 fork 的 main
      packages: write # 推 GHCR
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: 小写仓库名（docker tag 不允许大写）
        id: repo
        run: echo "lc=$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"

      - name: 同步上游 main
        id: sync
        run: |
          set -e
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git remote add upstream "$UPSTREAM" 2>/dev/null || git remote set-url upstream "$UPSTREAM"
          git fetch upstream --tags --force
          if git merge --no-edit upstream/main; then
            git push origin HEAD:main
            echo "已合并上游"
          else
            git merge --abort
            echo "::error::上游 main 与本 fork 的 main 有冲突，需要手工处理（一般不会发生，除非你改过同名文件）"
            exit 1
          fi
          ver=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "detected version: $ver"

      - name: 心跳（防 GitHub 60 天无活动自动停用定时任务）
        run: |
          f=.github/ci-heartbeat.txt
          last=$(cat "$f" 2>/dev/null || echo 1970-01-01)
          today=$(date -u +%F)
          age=$(( ($(date -u -d "$today" +%s) - $(date -u -d "$last" +%s)) / 86400 ))
          echo "心跳文件上次更新时间差: ${age} 天"
          if [ "$age" -ge 45 ]; then
            echo "$today" > "$f"
            git add "$f"
            git commit -m "ci: heartbeat $today"
            git push origin HEAD:main
          fi

      - uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 该版本镜像是否已存在
        id: check
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -n "$TAG" ] || TAG="${{ steps.sync.outputs.version }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.inputs.force }}" != "true" ] \
             && docker buildx imagetools inspect "ghcr.io/${{ steps.repo.outputs.lc }}:$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ghcr.io/${{ steps.repo.outputs.lc }}:$TAG 已存在，跳过构建"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建并推送（linux/amd64）
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          # 要 NAS 是 ARM（部分群晖/绿联机型）就把下面改成 linux/amd64,linux/arm64
          # 注意：加 arm64 走 QEMU 模拟，构建时间会从 ~20 分钟涨到 1 小时以上
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.lc }}:${{ steps.check.outputs.tag }}
            ghcr.io/${{ steps.repo.outputs.lc }}:main-${{ steps.sync.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 结果
        run: |
          {
            echo "### 镜像"
            echo ""
            echo '```'
            echo "docker pull ghcr.io/${{ steps.repo.outputs.lc }}:${{ steps.check.outputs.tag }}"
            echo '```'
            echo ""
            echo "NAS 上把 compose 里的 image 换成上面这个即可（记得 vt-init 那个服务一起换）。"
          } >> "$GITHUB_STEP_SUMMARY"
